services:
  postgres:
    image: postgres:16-alpine
    container_name: quran-reader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quran
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: quran_reader
    ports:
      - "5432:5432"
    volumes:
      - quran-reader-postgres-data:/var/lib/postgresql/data
      - ./prisma/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quran -d quran_reader"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  quran-reader-postgres-data:
